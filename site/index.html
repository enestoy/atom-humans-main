<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" />
  <title>atom-humans</title>
  <meta name="description" content="Atomlardan oluşan insan karakterleri. Dokuz animasyon durumu, insan yüzü ve yıldız tozu efektleri." />
  <link rel="preload" href="/fonts/OpenRunde-Medium.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    try {
      var saved = localStorage.getItem('atom-humans-theme');
      document.documentElement.dataset.theme = saved || 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
